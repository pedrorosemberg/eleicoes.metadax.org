name: AI Security Review

# Primeira validação da esteira de CI/CD (ver docs/ARCHITECTURE.md §15) —
# obrigatório antes de qualquer merge em hmg/prod. Chama um modelo gratuito
# do Gemini (Google AI Studio) via .github/scripts/ai-security-review.mjs,
# com instruções específicas deste projeto em
# .github/ai-security-review-instructions.md (prompt injection, prompt
# poisoning, segredos, integridade/disponibilidade/confidencialidade do dado
# exibido).
#
# Por que não é mais a action anthropics/claude-code-security-review: ela é
# hardcoded para a API/CLI da Anthropic, sem suporte a endpoint/provedor
# customizado — decisão do mantenedor (26/08/2026) foi usar uma camada
# gratuita em vez de uma ANTHROPIC_API_KEY paga. O script próprio roda do
# zero a cada commit (sem cache "já rodei" — o bug que isso causou na action
# anterior não existe aqui, ver docs/ARCHITECTURE.md §15).
#
# Por que Gemini e não NVIDIA (usado até 26/08/2026): a chamada à API da
# NVIDIA travava (nunca respondia) sempre que rodava a partir de um runner
# do GitHub Actions — 6 tentativas seguidas, 4 valores de timeout diferentes,
# sempre o mesmo hang total. A mesma chamada, feita de fora do GitHub
# Actions, respondia normalmente em ~400ms — evidência de bloqueio/limitação
# silenciosa específica do IP de origem do runner, não um bug deste script.
# Ver docs/ARCHITECTURE.md §19 para o histórico completo do diagnóstico.
on:
  pull_request:
    branches: [hmg, prod]

concurrency:
  group: ai-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Rodar revisão de segurança (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Guardado como secret (não como valor fixo aqui) por decisão do
          # mantenedor — permite trocar o modelo sem precisar de um PR. Ver
          # docs/ARCHITECTURE.md §19 para a recomendação atual (26/08/2026:
          # gemini-3.7-flash) e o porquê. Se ficar vazio, o script cai no
          # próprio fallback interno (ver ai-security-review.mjs). Se a API
          # retornar erro de modelo inválido, o catálogo do Google AI Studio
          # pode ter mudado — confira em https://aistudio.google.com/ e
          # atualize o secret GEMINI_MODEL.
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ai-security-review.mjs

      - name: Comentar no PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ai-security-review-comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file ai-security-review-comment.md
          fi
