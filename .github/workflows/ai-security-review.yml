name: AI Security Review

# Primeira validação da esteira de CI/CD (ver docs/ARCHITECTURE.md §15) —
# obrigatório antes de qualquer merge em hmg/main. Chama um modelo gratuito
# da NVIDIA (build.nvidia.com, endpoint OpenAI-compatible) via
# .github/scripts/ai-security-review.mjs, com instruções específicas deste
# projeto em .github/ai-security-review-instructions.md (prompt injection,
# prompt poisoning, segredos, integridade/disponibilidade/confidencialidade
# do dado exibido).
#
# Por que não é mais a action anthropics/claude-code-security-review: ela é
# hardcoded para a API/CLI da Anthropic, sem suporte a endpoint/provedor
# customizado — decisão do mantenedor (26/08/2026) foi usar a camada
# gratuita da NVIDIA em vez de uma ANTHROPIC_API_KEY paga. O script próprio
# roda do zero a cada commit (sem cache "já rodei" — o bug que isso causou
# na action anterior não existe aqui, ver docs/ARCHITECTURE.md §15).
on:
  pull_request:
    branches: [hmg, main]

concurrency:
  group: ai-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Diagnóstico de conectividade com a API da NVIDIA
        # Temporário: PR #11 (timeout 60s) e #12 (timeout 120s) travaram pelo
        # tempo EXATO do timeout nas duas tentativas, em ambos os casos — não
        # uma resposta lenta, um "hang" total. Isso não é o modelo demorando
        # a responder (aí pelo menos uma das 5 tentativas até agora teria
        # completado antes do limite); é mais consistente com a conexão
        # sendo derrubada/bloqueada silenciosamente antes de qualquer
        # resposta. Este passo faz uma chamada mínima (max_tokens=5) via
        # curl, com timing detalhado, só para diagnosticar onde trava
        # (DNS, TCP connect, TLS, ou espera por resposta) — não falha o job
        # (continue-on-error) e não substitui o passo de revisão abaixo.
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          curl -sS -m 20 -X POST https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"meta/llama-3.3-70b-instruct","messages":[{"role":"user","content":"ping"}],"max_tokens":5}' \
            -o /tmp/nvidia-diag.json \
            -w "\nHTTP_CODE=%{http_code} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TLS=%{time_appconnect}s TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\n" \
            || echo "curl falhou (exit $?) — provável timeout/conexão recusada, ver acima"
          cat /tmp/nvidia-diag.json 2>/dev/null || true

      - name: Rodar revisão de segurança (NVIDIA)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Modelo confirmado pelo mantenedor (26/08/2026, testado
          # diretamente contra a API da NVIDIA). Se a API retornar erro de
          # modelo inválido, o catálogo pode ter mudado o nome/removido o
          # modelo — confira em build.nvidia.com e ajuste aqui.
          NVIDIA_MODEL: meta/llama-3.3-70b-instruct
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ai-security-review.mjs

      - name: Comentar no PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ai-security-review-comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file ai-security-review-comment.md
          fi
