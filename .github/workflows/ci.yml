name: CI

# Gate de qualidade — obrigatório antes de qualquer merge em hmg/prod (ver
# docs/ARCHITECTURE.md §15). Roda os mesmos três comandos que
# CONTRIBUTING.md já pede para rodar localmente antes de um PR.
on:
  pull_request:
    branches: [hmg, prod]
  push:
    branches: [hmg, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build
